<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<title>shot</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #eef3f9; }
  iframe { border: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<iframe id="frame" src="/index.html"></iframe>
<script>
  const params = new URLSearchParams(location.search);
  const mode = params.get("mode") || "";
  const theme = params.get("theme") || "";
  const frame = document.getElementById("frame");
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  frame.addEventListener("load", async () => {
    const win = frame.contentWindow;
    const doc = frame.contentDocument;
    for (let i = 0; i < 120; i += 1) {
      if (win.__SJT__ && win.__SJT__.ready) { await win.__SJT__.ready; break; }
      await wait(100);
    }
    await wait(400);
    if (theme) doc.querySelector('[data-theme-option="' + theme + '"]').click();

    const cards = Array.from(doc.querySelectorAll(".driver-card"));
    cards.forEach((card, index) => {
      const input = card.querySelector(".rit-input");
      input.value = String(8 + index * 2);
      input.dispatchEvent(new Event("input", { bubbles: true }));
    });
    const firstCat = win.__SJT__.api.getState().masters.ukuran[0].id;
    Array.from(doc.querySelectorAll(".mat-input")).forEach((input, index) => {
      if (input.dataset.cat !== firstCat) return;
      input.value = String(8 + index * 2);
      input.dispatchEvent(new Event("input", { bubbles: true }));
    });
    await wait(300);

    if (mode) {
      doc.querySelector("#fab-main").click();
      await wait(350);
      if (mode !== "fab") {
        doc.querySelector('[data-fab="' + mode + '"]').click();
      }
    }
  });
</script>
</body>
</html>
